env:
  name: API Scan Environment
  contexts:
    - name: "TestContext"
      urls:
        - "${ZAP_TARGET}"
      # authentication:
      #   method: manual
      # 2025-11: that has not worked
      # sessionManagement:
      #   method: headers
      #   parameters:
      #     Client-ID: ""
      #     Api-Key: ""
      # users:
      #   - name: "test-user"
      #     credentials: {}
  parameters:
    failOnError: true
    failOnWarning: false
    continueOnFailure: false
    progressToStdout: true
  # vars:
  #   sample: "${ZAP_WORK_DIR}/zap-config"
  #   sample2: "${sample}/scripts"

jobs:
  # - type: requestor
  #   requests:
  #     - url: "${ZAP_TARGET}"
  #       method: "GET"
  #       headers:
  #         - "Client-ID:"
  #         - "Api-Key:"
  # - parameters:
  #     scanOnlyInScope: true
  #     enableTags: false
  #   rules: []
  #   name: "passiveScan-config"
  #   type: "passiveScan-config"

  - type: alertFilter
    parameters:
      deleteGlobalAlerts: false
    alertFilters:
      # SQL injection false positive
      - ruleId: 40018
        newRisk: "False Positive"
        url: ".*/api/v2/.*"
        urlRegex: true

  - type: openapi
    description: "Import OpenAPI and set target"
    parameters:
      apiFile: ${OPENAPI_FILE}
      targetUrl: "${ZAP_TARGET}"

  - type: script
    parameters:
      action: add
      type: httpsender
      engine: "ECMAScript : Graal.js"
      name: AddHeader.js
      inline: |
        function sendingRequest(msg, initiator, helper) {
            msg.getRequestHeader().setHeader("Client-ID", java.lang.System.getenv("CLIENT_ID"));
            msg.getRequestHeader().setHeader("Api-Key", java.lang.System.getenv("API_KEY"));
        }

        function responseReceived(msg, initiator, helper) {
            // Do nothing
        }

  # Run traditional spider
  # - type: spider
  #   # parameters:
  #   #   context: "TestContext"
  #   #   user: test-user

  - type: activeScan
    parameters:
      #context: "TestContext"
      policy: "API-minimal"
      #url: ${ZAP_TARGET}

  # - parameters: {}
  #   name: "passiveScan-wait-pre-report"
  #   type: "passiveScan-wait"

  - type: report
    parameters:
      # template: "modern" # modern exposes request/response objects! -> this exposes secrets because we do manipulate the requests object here
      template: traditional-html
      reportTitle: "ZAP Scanning Report"
      reportDescription: ""
      reportDir: "${ZAP_WORK_DIR}/zap-report-html"

  # - type: report
  #   parameters:
  #     reportDir: "${ZAP_WORK_DIR}/zap-report-md"
  #     reportTitle: "ScanTest"
  #     template: traditional-md
  #     reportDescription: "Descr"

  - type: exitStatus # Sets the exit code based on scan results
    parameters:
      errorLevel: High # String: Informational, Low, Medium, High, default: not set
      warnLevel: Low # String: Informational, Low, Medium, High, default: not set

